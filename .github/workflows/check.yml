# 자동 점검: GitHub에 코드를 올릴 때마다(어느 브랜치든) 실행된다. 하나라도 실패하면 빨간 X가 뜬다.
# 운영 DB에는 연결하지 않는다 — 이 점검 안에서만 쓰는 빈 시험용 Postgres를 매번 새로 띄워 쓴다.
name: 자동 점검

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 빌드 확인용 가짜 값(실제 Supabase 주소·키가 아님)
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 패키지 설치
        run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 코드 규칙 검사(lint)
        run: npm run lint
      - name: 계산 시험
        run: npm run test:unit
      - name: DB 회귀 시험(빈 시험용 DB)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash tests/db/run.sh
      - name: 빌드
        run: npm run build
